<h1>{{ portalName }}</h1>

<p>
  Manage your enrolled courses, view your academic profile,
  and explore available courses.
</p>
<p><strong>Courses Available:</strong> {{ availableCourses }}</p>
<p><strong>Enrolled:</strong> 3</p>
<p><strong>GPA:</strong> 3.8</p>

<hr>

<button
  [disabled]="!isPortalActive"
  (click)="onEnrollClick()">
  Enroll Now
</button>

<p>{{ message }}</p>

<hr>

<input
  type="text"
  placeholder="Search course"
  [(ngModel)]="searchTerm">

<p>Searching for: {{ searchTerm }}</p>
